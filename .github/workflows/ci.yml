name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning nft.sh tests/*.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: bash tests/unit_test.sh

  netns:
    name: Integration tests (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Run integration tests
        run: sudo bash tests/netns_test.sh

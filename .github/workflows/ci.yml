name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning nft.sh tests/*.sh scripts/*.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: bash tests/unit_test.sh
      - name: Verify dependency installation failure paths without installing packages
        run: sudo bash tests/jool_install_test.sh

  netns:
    name: Integration tests (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Run integration tests
        run: sudo bash tests/netns_test.sh

  systemd:
    name: Integration tests (systemd timers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Run systemd integration tests
        run: sudo bash tests/systemd_test.sh

  kernel:
    name: Kernel IPv4/IPv6 translation (Jool)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Jool tools and matching kernel module
        run: sudo env CI=true bash scripts/ci_install_jool.sh
      - name: Run real dual-stack kernel forwarding tests
        run: |
          sudo bash tests/kernel_netns_test.sh
          sudo bash tests/kernel_netns_test.sh --same-ports
      - name: Verify actual systemd rollback of custom kernel deployment
        run: sudo bash tests/kernel_systemd_test.sh

  debian:
    name: Debian ${{ matrix.version }} tools and kernel builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ['11', '12', '13']
    steps:
      - uses: actions/checkout@v4
      - name: Verify native dependencies, tools and both Debian kernel flavours
        run: |
          docker run --rm --cap-add NET_ADMIN --env CI=true \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            debian:${{ matrix.version }} bash /src/tests/debian_build_test.sh

  coexistence:
    name: Integration tests (Docker and WireGuard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install networking tools
        run: sudo apt-get update && sudo apt-get install -y nftables wireguard-tools
      - name: Start Docker
        run: sudo systemctl start docker
      - name: Run coexistence tests
        run: sudo bash tests/coexistence_test.sh

  package:
    name: Validate release package
    runs-on: ubuntu-latest
    needs: [shellcheck, unit, netns, systemd, kernel, debian, coexistence]
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release assets
        run: bash scripts/package_release.sh
